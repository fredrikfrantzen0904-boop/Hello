schema_version: 1
title: GIE acceptance test register
description: 'One entry per acceptance requirement of the session briefs. ''status'' is maintained by tools/gie_registers.py
  from recorded pytest evidence: planned (no tests yet), passing (all marked tests passed), failing (any marked
  test failed or errored), blocked (cannot be executed; see blockers), partial (tests pass but part of the scope
  is blocked or skipped). It is never set by hand to passing.'
status_values:
- planned
- passing
- failing
- blocked
- partial
