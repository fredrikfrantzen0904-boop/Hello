  - Europe/Prague                           # IANA time zone
  - claude/gold-intelligence-engine-l9uw10  # git branch
  - gie/s01-market-data                     # example of a session branch name
  - fredrikfrantzen0904-boop/Hello          # the repository itself
  - reviews/session_NN/                     # pattern, NN = session number
  - core/                                   # path names used by the briefs (see path_mapping)
  - contracts/
  - execution/
  - risk/
  # files the owner's audit tool writes on the owner's machine, and examples in its README
  - inventory.json
  - manifest.jsonl
  - processes.json
  - audit_log.txt
  - config.py
  - requirements.txt
  # directories described as not started / created later
  - gie/app/
  - gie/market_data/
  - gie/strategy_intelligence/
  - gie/intermarket/
  - gie/prediction/
  - gie/decision/
  - gie/reflex/
  - gie/execution/
  - gie/risk/
  - gie/learning/
  - gie/backtesting/
  - dashboard/gie/
  - models/research/
  - tests/gie/qa/
  - reviews/qa/
  - reviews/session_01/
  - specifications/baselines/frozen/

# Paths that existed before the project and must stay byte-identical (OWN-13, M-AUTH-12).
protected_paths:
  base_commit: 35e32cff311eef08294540fd88d9a01a5a2f7c41
  # path -> git blob SHA-1 of the file content at base_commit
  paths:
    Start: ff972e3e86e8628ee696ede5ca1a3c8f92fe1197
