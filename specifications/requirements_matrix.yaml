- id: OWN-01
  source: specifications/source/OWNER_DIRECTIVE_2026-11-27.md
  section: Owner launch instructions
  kind: governance
  text: You will coordinate the entire project within this session.
  source_clause: The ZIP contains the complete Gold Intelligence Engine project specification and all 13 specialist
    development briefs. You will coordinate and implement the entire project within this session. Read every PDF
    in full before beginning. Extract and preserve all requirements in permanent project documentation so nothing
    is lost during context compaction. Treat ChatGPT as the architectural supervisor and independent reviewer, and
    me as the project owner with final authority. You are responsible for implementation, not independently reducing
    the agreed scope. You may use specialized subagents and parallel development where appropriate, provided all
    components follow the approved shared architecture. Begin with Session 00 only. Maintain a persistent requirements
    matrix, implementation status, decision log and acceptance test register throughout development. Do not silently
    simplify functionality, substitute placeholders, omit requirements or declare incomplete components finished.
    If you encounter technical limitations, document them and propose solutions for approval. Complete Session 00
    and submit the foundation review PDF, shared contracts, source files and test evidence. Stop at the architectural
    review gate before implementing the remaining subsystems. Preserve all existing trading systems. Live execution
    must remain disabled throughout development and validation.
  sessions: [S00]
  status: not_started
  review_status: unverified
  contributions: []
  notes: ''
