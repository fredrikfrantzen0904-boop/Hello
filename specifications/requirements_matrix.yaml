status_values:
  not_started: No implementation work yet.
  in_progress: Work started, not complete.
  partial: A foundation portion is delivered; the remainder is owned by a later session (see contributions).
  implemented: Code/document exists but automated or review evidence is incomplete.
  verified: Implemented and backed by recorded, reproducible evidence.
  blocked: Cannot proceed; see the linked blocker / change request.
  not_applicable: Informational clause with nothing to implement (justified in notes).
review_status_values:
- unverified
- approved
- conditional
- rejected
