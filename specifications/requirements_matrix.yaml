schema_version: 1
title: GIE requirements matrix
description: Atomised requirements extracted from specifications/source/*.pdf (text in specifications/extracted/)
  and from the owner's launch directive. This file is the single source of truth; specifications/REQUIREMENTS_MATRIX.md
  is rendered from it by tools/gie_registers.py. Never delete a requirement; change status only with evidence.
conventions: 'id: stable, never renumbered, never deleted; atoms split off later are appended. text: the owner''s
  words only - every word occurs in source_clause (a few function words may connect them). source: the specification
  document; source_clause: the verbatim paragraph the atom was taken from - it occurs word for word in the extracted
  text of the source ('' ... '' marks an omission between two verbatim parts). notes: context added by the coordinator,
  interpretations, cross-references and open items. sessions: sessions that must contribute or comply. contributions:
  what each session delivered, with status and evidence paths.'
specification:
  version: V1.0 (27 Nov 2026)
  note: MASTER.pdf is the copy inside GIE_Project_PDFs.zip; MASTER_owner_upload.pdf is the separately uploaded MASTER_1.pdf.
    Both extract to identical text. A changed hash means the specification changed and the matrix must be re-verified.
