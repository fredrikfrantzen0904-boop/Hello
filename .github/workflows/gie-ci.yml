# Integration CI for the Gold Intelligence Engine (requirement S00-ASG-29).
# Runs the same entry point as local development: python -m tools.ci
# No secrets are used. No job deploys, trades or contacts a broker.
name: gie-ci

on:
  push:
    branches: ["claude/**", "gie/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gie-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the protected-path check compares against the base commit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Integration CI
        run: python -m tools.ci --evidence-dir ci-evidence
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gie-ci-evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: ci-evidence/
          if-no-files-found: warn
