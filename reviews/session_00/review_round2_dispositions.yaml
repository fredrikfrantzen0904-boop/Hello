# Dispositions of the round-2 independent review findings (Session 00).
#
# Findings (verbatim): reviews/session_00/evidence/review_round2_findings.json
# L2B-nn: reviewer for sessions 10 / 11 / 12 (backtesting, dashboard, QA).
# L2E-nn: reviewer for sessions 06 / 07 / 08 (reflex, execution, risk).
# One entry per finding id.  disposition:
#   fix      - corrected in the foundation (action says where)
#   record   - not decided or not built in Session 00; recorded as a change request / contract
#              extension / open item with an owner (action names it)
#   decline  - not adopted, with the reason
# Where only part of a finding was corrected the action says which part was fixed and where the
# rest is recorded; such an entry is 'fix' only if nothing of substance is left open, else 'record'.
schema_version: 1
round: 2
rules:
  - "A defect in something Session 00 delivered is corrected in Session 00."
  - "A new shared type that a later session needs is not invented here: it is recorded as a contract extension (specifications/dependency_graph.yaml) with the session that proposes it and the sessions that consume it."
  - "A design decision that belongs to a later session's brief is recorded for that session; the contracts are kept permissive enough not to block it and strict enough to keep the owner's unconditional rules."
dispositions:
  # ------------------------------------------------------------ backtesting / dashboard / QA lens
  L2B-01: {disposition: fix, action: "journal: a record is stamped with the step in which it is published when the journal has the run clock (step time in replay and paper, D-024); a derived record before any input is refused; tick receive times never decrease across streams; the input watermark is also advanced by ClockReading, so the guard does not depend on storing ticks; SHARED_CONTRACTS 6.2 states that the guard judges declared watermarks and that the prefix-invariance test of session 10 remains mandatory"}
  L2B-02: {disposition: fix, action: "risk_decision.advance_daily_risk + LifecycleLedger: per run and trading day, across all risk producers, a profit floor never decreases and never disappears and a halt stays in force; RSK-6 lets the floor be carried once established; RSK-7/RSK-8 are decided on exact amounts"}
  L2B-03: {disposition: fix, action: "FileJournal: a record is written (and synchronised) before it becomes part of the journal; after a write error the journal is failed and refuses publication until reopened; exclusive OS lock on <path>.lock refuses a second writer; injectable opener for failure injection"}
  L2B-04: {disposition: fix, action: "one ledger per run, owned by the journal; the gateway has no ledger of its own, journals each request before the adapter sees it and each report as it arrives; orders created by the simulated broker (attached stop / take profit, broker-side close) enter through poll() with originator BROKER and are checked against the filled entry order; golden run trace samples.run_story() covers 'entry fills, stop order appears' (D-021, D-025)"}
  L2B-05: {disposition: fix, action: "RunManifest.created_time_ns is null for a replay (RUN-2); model statuses are pinned in RunManifest.models and the journal holds candidates and plans to the pinned status; a restarted process continues with the manifest in the journal (D-027)"}
  L2B-06: {disposition: fix, action: "run_id is derived from every field of the manifest (RUN-1, RunManifest.create / derive_run_id); code_tree_dirty; gie.core.ids.derive_seed and RunContext.seed_for; the journal refuses ticks from undeclared sources and outside the declared replay period.  Recorded, not built: the run-configuration document and per-stream data digests (CX-12, session 10 with 01)"}
  L2B-07: {disposition: record, action: "journal provenance checks: no record claims a better data origin than its run, a tick no better than the run declares, a scoring model must be pinned by the manifest for the record's watermark with the pinned status, sizing quality only from a model pinned as validated.  The validated flag of a model is read from the manifest (RunModel.validated), the first record of every journal, instead of being copied onto every candidate.  Recorded, not built (final verification): the pins themselves are not compared with the model registry - that check belongs to the start of a run (CX-10) and needs the registry of session 09 (D-026)"}
  L2B-08: {disposition: record, action: "fixed: components receive read-only ClockView / SchedulerView (only the run loop moves time); RecordListener protocol and the normative step and cascade rule (interfaces.py, SHARED_CONTRACTS 10).  Recorded: the shared step driver with a replay/paper conformance test is CX-10, owned by the coordinator, required before any subsystem is integrated"}
  L2B-09: {disposition: record, action: "CX-05 extended: account snapshot carries daily state, daily result, profit floor, reference equity and breach flags, is emitted on every state change, at every trading-day boundary and periodically; consumers 10, 11, 12 added; its sequence rule is risk_decision.advance_daily_risk"}
  L2B-10: {disposition: record, action: "fixed: encoding a non-record raises UnknownContractError; SHARED_CONTRACTS 5 no longer says errors are journaled as such.  Recorded: CX-11 health / error event and heartbeat rule (coordinator, with the step driver), CX-13 feed status (session 01), CX-14 latency summary record (session 01 with 06/07)"}
  L2B-11: {disposition: record, action: "fixed: RunManifest.risk_regime (CHALLENGE_RULES / UNCONSTRAINED_RESEARCH, RUN-5) and role bound into run_id.  Recorded: experiment / trial / holdout bookkeeping and the run catalogue are CX-12 (session 10)"}
  L2B-12: {disposition: record, action: "fixed: RunManifest.models is a schedule (status, validated, valid_from_ns, valid_until_ns; up to 4096 entries) and the journal refuses a candidate or plan whose model is not scheduled for its watermark.  Recorded: enforcing out-of-sample scoring and publishing the split specification as a record is CX-12 (session 10 with 04); is_out_of_sample stays as the shared helper"}
  L2B-13: {disposition: fix, action: "gie.contracts.journal.JournalReader: read-only, follows appended lines, treats an incomplete last line as not yet published, verifies every line, keeps no records in memory; the writer is protected by the lock.  The import rule for the dashboard (read_only in the dependency graph) is checked by tools/check_architecture.py"}
  L2B-14: {disposition: fix, action: "tools/gie_registers.py: specifications/requirements_lock.json pins every requirement (append-only; a rewording needs --reword with a reason); the source clause must occur verbatim in the extracted specification text and every word of the requirement text in its clause; 'verified' needs a passing acceptance entry for acceptance requirements and a verified contribution from every listed session; a review status other than unverified needs an APPROVED decision.  Limit (final verification, D-015): the lock is append-only relative to itself, not anchored in the git history"}
  L2B-15: {disposition: fix, action: "tests/conftest.py records commit, dirty flag and collection errors; sync-evidence refuses incomplete runs and has --check, run by CI against fresh evidence; validate re-derives acceptance counts from the recorded evidence file; tools/build_review.py takes the commit from the evidence and fails on a mismatch; tools/ci.py records the tree state before the run; evidence directories are ignored by git"}
  L2B-16: {disposition: fix, action: "adapter registration is judged by the module that registers and by the globals of the method functions, not only by the self-declared __module__; registered functions are snapshotted; the same frame check applies to Record subclasses; layer 4 (tools/check_live_lock.py with specifications/lock_pins.json and tests) is delivered"}
  L2B-17: {disposition: fix, action: "every tool, test and evidence file named by the documents exists at the reviewed commit and tools/check_docs_paths.py makes that a CI gate; the review PDF prints each gate's result from ci_results.json; README states the state that the CI run shows"}
  L2B-18: {disposition: fix, action: "OrderEvent.fill_tick_source / fill_tick_seq on every fill (OEV-9); reference_price mandatory for every MARKET order (OEV-16); a fill at or after valid_until_ns is refused (OEV-13).  Where a run journals the tick stream, the journal refuses a fill that names a quote which is not part of it.  Recorded: re-pricing fills against the tick store is a QA helper of session 12 that needs the lookup of a tick by (source, seq) from the tick store of session 01 (CX-19, must_define)"}
  L2B-19: {disposition: fix, action: "dependency graph: sessions 10, 11 and 12 added as consumers of the extensions they need; CX-10 .. CX-16 added (step driver, health events, run configuration and catalogue, feed status, latency record, run results, learning results)"}
  L2B-20: {disposition: record, action: "CX-17 display projection for browsers (session 11 with the coordinator); SHARED_CONTRACTS 7 states that canonical JSON must not be parsed with a double-precision JSON parser"}
  # ------------------------------------------------------------ reflex / execution / risk lens
  L2E-01: {disposition: fix, action: "Position grows only through fills of its entry order: initial_volume_lots may increase, open volume only by as much, entry price and initial risk only then (validate_position_transition); the ledger holds initial_volume_lots to the entry order's cumulative fill; a protective stop's volume follows the position: every event of a reduce-only order, broker reports included, is held to the entry order's fill, and a report can neither cancel nor shrink the working protective stop of open volume (run ledger); golden trace with a partial and a final fill"}
  L2E-02: {disposition: fix, action: "wiring is normative (SHARED_CONTRACTS 9.3, D-021): one ledger per run in the journal; request -> journal -> adapter -> reports -> journal; a re-sent request is forwarded again (adapter idempotent per order_event_id)"}
  L2E-03: {disposition: fix, action: "OrderEvent.originator (EXECUTION / BROKER, OEV-15): the simulated broker creates the attached protective stop and take profit at the entry's first fill and may create broker-side exits; they enter through poll(); Position.protective_client_order_id / unprotected_reason (POS-9); a protective stop never expires (validate_order_transition)"}
  L2E-04: {disposition: fix, action: "GuardedExecutionAdapter.poll returns PollResult(events, duplicates, errors): each report is judged and journaled on its own; an older duplicate is recognised by the journal"}
  L2E-05: {disposition: fix, action: "the gateway takes plan, approval and position from the run ledger (no caller-supplied snapshots; newest plan revision only); reduce-only aggregates: one working protective stop per position, working exit and take-profit volume within the open volume; reduce-only semantics stated in SHARED_CONTRACTS 9.3"}
  L2E-06: {disposition: fix, action: "single writer: order events are written by session 07 only; the reflex engine states intents through interfaces.ProtectionPort (D-025); seq is compared only within one producer"}
  L2E-07: {disposition: fix, action: "ORDER_TRANSITIONS: reports that were under way when a cancel was requested (ACCEPTED, REJECTED, REPLACED, REPLACE_REJECTED in PENDING_CANCEL); only receive_time_ns must be monotonic; one outstanding replacement per order stated in the contract"}
  L2E-08: {disposition: fix, action: "OEV-11 judges only the prices GIE asked for; POS-4 lets a position open at or beyond its stop after a gap (the stop closes it at once)"}
  L2E-09: {disposition: record, action: "fixed: peak_time_ns is the receive time of the quote that made the peak; snapshot cadence, the order broker -> positions -> reflex within a step and record delivery (RecordListener) are stated.  Recorded: the shared valuation function belongs to CX-04 (session 07), because it needs the instrument specification"}
  L2E-10: {disposition: record, action: "fixed as L2B-02 plus: reference_equity_amount cannot change within a trading day.  Recorded: the daily risk state as a record of its own is part of CX-05 (session 08)"}
  L2E-11: {disposition: fix, action: "RSK-8: risk + open risk + pending risk within the surplus above the floor; RSK-13: an approval states equity, open risk, pending risk, margin required and free and the gap-stress loss, and margin required does not exceed margin free"}
  L2E-12: {disposition: record, action: "CX-18 reservation life-cycle record (session 08; the gateway check is added with it).  Already enforced: an approval can be spent by exactly one entry order, and not after it expired"}
  L2E-13: {disposition: record, action: "fixed: a fill found by reconciliation carries its fill fields and cost (OEV-9); ledger.open_positions(); a report is delivered at its receive instant and the simulator schedules its own wake-up (interfaces.ExecutionAdapter); write-ahead journaling means no order of GIE exists at the simulated broker that the journal does not know.  Recorded: adapter queries for reconciliation and journal checkpoints are CX-19 (session 07)"}
  L2E-14: {disposition: record, action: "fixed: RecordSink.commit() gives one synchronisation per step; tools/benchmark_foundation.py measures the per-step case.  Recorded as known limits with measurements (docs/ARCHITECTURE.md 10): the journal and ledger keep the run in memory; checkpoints, eviction and whether raw ticks are journaled or referenced are CX-19 (session 07 with 01)"}
  L2E-15: {disposition: fix, action: "see L2B-16.  Limit (final verification, D-011): a module name is self-declared; code that uses exec can declare any name, and the static scan forbids exec, eval, compile and dynamic imports in GIE code"}
  L2E-16: {disposition: fix, action: "trigger side and the order broker -> reflex are normative (OrderEvent, SHARED_CONTRACTS 10); OrderEvent.max_slippage is checked against the plan; an attached take profit is one of the plan's targets (validate_entry_authorization)"}
  L2E-17: {disposition: fix, action: "Position.protective_client_order_id; session 06 is a TradePlan consumer and finds the plan of a position in the ledger (LifecycleLedger.plan)"}
  L2E-18: {disposition: fix, action: "RiskDecision.daily_pnl_amount / profit_floor_amount; boundaries are decided on amounts; the fractions are derived with a stated rounding (gie.core.canonical.fraction_of, RSK-9)"}
  L2E-19: {disposition: record, action: "CR-007: exposure, correlated risk, base size before adaptation and the quality value used are proposed by session 08 as new optional fields of RiskDecision (a MINOR change); session 08 reads the candidate of a plan through the ledger"}
